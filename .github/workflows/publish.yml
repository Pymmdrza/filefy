# CI & Release workflow for Filefy
#
# Features
# --------
# • Linting with pre-commit hooks (Black, Ruff, isort, etc.)
# • Security & dependency audit
# • Test matrix → Python 3.9-3.13 on Ubuntu, macOS, Windows
# • Wheel builds via cibuildwheel (manylinux, Mac, Windows)
# • Source-dist build via pypa-build
# • Trusted publishing to PyPI with OpenID Connect (no API token)
# • Re-usable caching for pip & cibuildwheel
# • Upload of wheels/sdist as GitHub Release assets

name: CI / Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# ---------- Shared cache keys ----------
env:
  PIP_CACHE_KEY: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') }}
  CIBW_CACHE_KEY: ${{ runner.os }}-cibw-v1

# ---------- Job 1: Lint & static analysis ----------
jobs:
  lint:
    name: Lint / Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ env.PIP_CACHE_KEY }}

      - name: Install pre-commit & mypy
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit mypy

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Static type analysis
        run: mypy filefy

# ---------- Job 2: Security / dependency audit ----------
  security:
    name: Bandit & pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit
        run: bandit -q -r filefy

      - name: Run pip-audit
        run: pip-audit

# ---------- Job 3: Test matrix ----------
  test:
    name: Tests ${{ matrix.os }} Py ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    needs: [lint, security]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ env.PIP_CACHE_KEY }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Install package (editable)
        run: pip install -e .

      - name: Run tests
        run: pytest -v --cov=filefy --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unit
        continue-on-error: true

# ---------- Job 4: Build wheels & sdist ----------
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ env.PIP_CACHE_KEY }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/cibuildwheel
          key: ${{ env.CIBW_CACHE_KEY }}

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build cibuildwheel twine

      - name: Build wheels with cibuildwheel
        run: cibuildwheel --output-dir wheelhouse

      - name: Build sdist
        run: python -m build --sdist --outdir dist

      - name: Combine artifacts
        run: |
          mkdir -p dist
          cp wheelhouse/* dist/

      - name: Twine check
        run: twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

# ---------- Job 5: Publish to PyPI (tags only) ----------
  publish:
    name: Publish to PyPI (trusted)
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    environment:
      name: pypi
      url: https://pypi.org/project/filefy/

    permissions:
      id-token: write  # OIDC for trusted publishing
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Publish with twine (OIDC)
        env:
          TWINE_USERNAME: __token__
        run: twine upload --skip-existing dist/*

# ---------- Job 6: Upload release assets ----------
  release-assets:
    name: Attach artifacts to GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
