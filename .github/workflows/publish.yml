name: CI / Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# ──────────────────────────────────────────────────────────────
jobs:
  # 1. Linting & static analysis
  lint:
    name: Lint / Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') }}

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit mypy

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Static type analysis
        run: mypy filefy

  # 2. Security & dependency audit
  security:
    name: Bandit & pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit
        run: bandit -q -r filefy

      - name: Run pip-audit
        run: pip-audit

  # 3. Test matrix
  test:
    name: Tests ${{ matrix.os }} Py ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    needs: [lint, security]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Install package
        run: pip install -e .

      - name: Run tests
        run: pytest -v --cov=filefy --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unit
        continue-on-error: true

  # 4. Build distributions (wheels + sdist)
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') }}

      - name: Cache cibuildwheel
        uses: actions/cache@v4
        with:
          path: ~/.cache/cibuildwheel
          key: ${{ runner.os }}-cibw-v1

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build cibuildwheel twine

      - name: Build wheels (all platforms)
        run: cibuildwheel --output-dir wheelhouse

      - name: Build sdist
        run: python -m build --sdist --outdir dist

      - name: Combine artifacts
        run: |
          mkdir -p dist
          cp wheelhouse/* dist/

      - name: Twine check
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  # 5. Publish to PyPI (tags only, trusted publishing)
  publish:
    name: Publish to PyPI (trusted)
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/filefy/
    permissions:
      id-token: write   # OIDC
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Publish with twine (OIDC)
        env:
          TWINE_USERNAME: __token__
        run: twine upload --skip-existing dist/*

  # 6. Attach artifacts to GitHub Release (tags only)
  release-assets:
    name: Attach artifacts to GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
