# Build and publish Filefy to PyPI.
#
# This workflow is the single source of truth for releases. It triggers
# exclusively on push of a `vX.Y.Z` tag (which is created automatically
# by `version-bump.yml` on every push to the default branch, or manually
# by a maintainer). Triggering only on tags - and not on the GitHub
# `release` event as well - prevents the duplicate uploads that used to
# cause "File already exists" errors on PyPI.
#
# A safety check verifies that the tag matches the version recorded in
# `filefy/_version.py`, and `twine upload --skip-existing` is used so
# accidental re-runs never fail the workflow.

name: Build and Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: 'Publish to PyPI'
        required: true
        default: 'true'
        type: boolean

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Job 1: Validate that the tag matches the in-repo version.
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Read version from source
        id: read
        run: |
          VERSION=$(jq -r '.version' filefy/config/details.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          EXPECTED="v${{ steps.read.outputs.version }}"
          if [ "${TAG}" != "${EXPECTED}" ]; then
            echo "Tag ${TAG} does not match source version ${EXPECTED}." >&2
            exit 1
          fi
          echo "Tag ${TAG} matches source version."

  # Job 2: Run the test suite across all supported Python versions.
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Install package in editable mode
        run: pip install -e .

      - name: Run tests
        run: pytest tests/ -v --cov=filefy --cov-report=xml

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  # Job 3: Build the sdist and wheel.
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package with twine
        run: twine check dist/*

      - name: Verify wheel contents include bundled config
        run: |
          python - <<'PY'
          import glob
          import zipfile
          wheels = glob.glob("dist/*.whl")
          assert wheels, "No wheel produced"
          with zipfile.ZipFile(wheels[0]) as zf:
              names = zf.namelist()
          required = [
              "filefy/__init__.py",
              "filefy/cli.py",
              "filefy/server.py",
              "filefy/_version.py",
              "filefy/tunnel.py",
              "filefy/install_cloudflared.py",
              "filefy/config/__init__.py",
              "filefy/config/config_manager.py",
              "filefy/config/details.json",
              "filefy/config/settings.json",
          ]
          missing = [r for r in required if r not in names]
          if missing:
              raise SystemExit(f"Wheel is missing required files: {missing}")
          # Confirm the cloudflared installer console-script is registered
          # so `pip install filefy` users get it out-of-the-box.
          entry_points = [n for n in names if n.endswith("entry_points.txt")]
          assert entry_points, "Wheel is missing entry_points.txt"
          with zipfile.ZipFile(wheels[0]) as zf:
              ep_text = zf.read(entry_points[0]).decode()
          if "filefy-install-cloudflared" not in ep_text:
              raise SystemExit(
                  "Wheel entry_points.txt is missing "
                  "'filefy-install-cloudflared' console script."
              )
          print("Wheel contents OK.")
          PY

      - name: Smoke-test installed CLI
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/filefy --version
          /tmp/smoke/bin/filefy --help
          # The cloudflared installer must be available as a dedicated
          # console script and must also be importable as a module so
          # the --tunnel auto-install path works without any extra
          # dependencies.
          /tmp/smoke/bin/filefy-install-cloudflared --help
          /tmp/smoke/bin/python -c "from filefy.install_cloudflared import ensure_cloudflared, main"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 5

  # Job 4: Publish to PyPI (trusted publishing via OIDC, with token fallback).
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_pypi == 'true')

    environment:
      name: pypi
      url: https://pypi.org/project/filefy/

    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install twine
        run: |
          python -m pip install --upgrade pip
          pip install twine

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload --skip-existing --non-interactive dist/*

  # Job 5: Attach build artifacts to the matching GitHub release (if any).
  release-assets:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
