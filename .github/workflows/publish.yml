# Build, verify, and publish Filefy to PyPI.
#
# Release source of truth:
# - Official publishing happens only from vX.Y.Z tags.
# - The tag must match filefy/config/details.json.
# - The package is built once, verified, uploaded as an artifact,
#   then published from the exact same dist/ files.
#
# PyPI publishing uses Trusted Publishing / OIDC via pypa/gh-action-pypi-publish.
# Configure the matching Trusted Publisher on PyPI before enabling this workflow.

name: Build and Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: 'Publish to PyPI'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read and validate version
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from pathlib import Path

          path = Path("filefy/config/details.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          version = str(data.get("version", "")).strip()

          if not version:
              raise SystemExit("Missing version in filefy/config/details.json")

          # Conservative semver-like validation.
          # Adjust this if you intentionally use dev/rc/post versions.
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:[a-zA-Z0-9_.+-]+)?", version):
              raise SystemExit(f"Invalid version format: {version!r}")

          print(f"version={version}")
          PY

      - name: Verify tag matches source version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          EXPECTED="v${{ steps.version.outputs.version }}"

          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::Tag '$TAG' does not match source version '$EXPECTED'."
            exit 1
          fi

          echo "Tag '$TAG' matches source version '$EXPECTED'."

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: validate

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
            setup.py
            setup.cfg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov

      - name: Install package
        run: python -m pip install -e .

      - name: Run tests
        run: |
          pytest tests/ \
            -v \
            --cov=filefy \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs:
      - validate
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            setup.py
            setup.cfg

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: List built artifacts
        run: |
          ls -lah dist/
          python - <<'PY'
          from pathlib import Path

          files = sorted(Path("dist").glob("*"))
          wheels = [p for p in files if p.suffix == ".whl"]
          sdists = [p for p in files if p.name.endswith(".tar.gz")]

          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly one wheel, found: {wheels}")
          if len(sdists) != 1:
              raise SystemExit(f"Expected exactly one sdist, found: {sdists}")

          print("Artifacts OK:")
          for file in files:
              print(f" - {file}")
          PY

      - name: Check package metadata
        run: twine check --strict dist/*

      - name: Verify wheel contents
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, f"Expected one wheel, got {wheels}"

          required = {
              "filefy/__init__.py",
              "filefy/cli.py",
              "filefy/server.py",
              "filefy/_version.py",
              "filefy/tunnel.py",
              "filefy/install_cloudflared.py",
              "filefy/config/__init__.py",
              "filefy/config/config_manager.py",
              "filefy/config/details.json",
              "filefy/config/settings.json",
          }

          with zipfile.ZipFile(wheels[0]) as zf:
              names = set(zf.namelist())
              missing = sorted(required - names)

              if missing:
                  raise SystemExit(f"Wheel is missing required files: {missing}")

              entry_points = [n for n in names if n.endswith("entry_points.txt")]
              if not entry_points:
                  raise SystemExit("Wheel is missing entry_points.txt")

              ep_text = zf.read(entry_points[0]).decode("utf-8")

          expected_scripts = [
              "filefy",
              "filefy-install-cloudflared",
          ]

          missing_scripts = [
              script for script in expected_scripts
              if script not in ep_text
          ]

          if missing_scripts:
              raise SystemExit(
                  f"Wheel entry_points.txt is missing console scripts: {missing_scripts}"
              )

          print("Wheel contents OK.")
          PY

      - name: Smoke-test wheel install
        run: |
          python -m venv /tmp/smoke-wheel
          /tmp/smoke-wheel/bin/python -m pip install --upgrade pip
          /tmp/smoke-wheel/bin/python -m pip install dist/*.whl

          /tmp/smoke-wheel/bin/filefy --version
          /tmp/smoke-wheel/bin/filefy --help
          /tmp/smoke-wheel/bin/filefy-install-cloudflared --help
          /tmp/smoke-wheel/bin/python -c "from filefy.install_cloudflared import ensure_cloudflared, main"

      - name: Smoke-test sdist install
        run: |
          python -m venv /tmp/smoke-sdist
          /tmp/smoke-sdist/bin/python -m pip install --upgrade pip
          /tmp/smoke-sdist/bin/python -m pip install dist/*.tar.gz

          /tmp/smoke-sdist/bin/filefy --version
          /tmp/smoke-sdist/bin/filefy --help
          /tmp/smoke-sdist/bin/python -c "import filefy; print(filefy.__file__)"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ needs.validate.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - validate
      - build

    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi)

    environment:
      name: pypi
      url: https://pypi.org/project/filefy/

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.validate.outputs.version }}
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release-assets:
    name: Upload GitHub release assets
    runs-on: ubuntu-latest
    needs:
      - validate
      - build

    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.validate.outputs.version }}
          path: dist/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
