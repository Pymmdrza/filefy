name: Auto Bump Version

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"

  workflow_dispatch:
    inputs:
      part:
        description: Version part to bump
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    name: Bump version, create tag, and publish release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync branch
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Determine bump type
        id: bump_type
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            PART="${{ inputs.part }}"
          else
            MSG="$(git log -1 --pretty=%B)"

            if grep -qi '\[bump major\]' <<< "$MSG"; then
              PART="major"
            elif grep -qi '\[bump minor\]' <<< "$MSG"; then
              PART="minor"
            else
              PART="patch"
            fi
          fi

          echo "part=$PART" >> "$GITHUB_OUTPUT"

      - name: Bump version
        id: bump
        shell: bash
        run: |
          set -euo pipefail

          NEW_VERSION="$(python scripts/bump_version.py '${{ steps.bump_type.outputs.part }}')"

          if ! [[ "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $NEW_VERSION" >&2
            exit 1
          fi

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure tag does not exist
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          if git rev-parse "refs/tags/${{ steps.bump.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag already exists: ${{ steps.bump.outputs.tag }}" >&2
            exit 1
          fi

      - name: Commit version bump
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add filefy/_version.py filefy/config/details.json

          if git diff --cached --quiet; then
            echo "No version files changed." >&2
            exit 1
          fi

          git commit -m "chore(release): bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Create and push tag
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.bump.outputs.tag }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: Filefy ${{ steps.bump.outputs.tag }}
          target_commitish: ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          token: ${{ secrets.RELEASE_TOKEN }}
          body: |
            ## Filefy ${{ steps.bump.outputs.tag }}

            This release was created automatically after the version bump to `${{ steps.bump.outputs.new_version }}`.

            ### Install or upgrade

            ```bash
            pip install --upgrade filefy==${{ steps.bump.outputs.new_version }}
            ```

            ### What is included

            - A signed Git tag for this release.
            - Automatically generated release notes from merged pull requests and commits.
            - Python wheel and source distribution assets after the CI / Release workflow finishes.

            ### Helpful links

            - Documentation: https://filefy.readthedocs.io/en/latest/
            - Package: https://pypi.org/project/filefy/
            - Issues: https://github.com/Pymmdrza/filefy/issues

            Please review the generated notes below before upgrading production deployments.
